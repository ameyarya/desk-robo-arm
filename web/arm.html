<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robo Arm</title>
<style>
:root{color-scheme:dark;--bg:#0b0f15;--panel:#121822e6;--panel2:#1b2330;--line:#263142;--line2:#35445b;--fg:#eef3fa;--dim:#9aabc2;--dim2:#7d8ea8;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--accent:#60a5fa;--arm:#f59e0b;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#16233a 0%,var(--bg) 60%) var(--bg);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 24px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .12s,border-color .12s,transform .05s}
button:hover{background:#243045}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}.brand h1{font-size:20px;margin:0;font-weight:650}.brand .sub{font-size:12px;color:var(--dim2)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#121822cc;font-size:12px;color:var(--dim)}
.pill b{color:var(--fg);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px #4ade8088}.dot.bad{background:var(--bad)}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim2);margin:0 0 10px}
#arm{width:100%;padding:14px;font-size:16px;font-weight:650;border-radius:14px}
#arm.armed{background:var(--arm);border-color:#fbbf24;color:#1b1206}
#stop{width:100%;margin-top:8px;padding:16px;font-size:20px;font-weight:800;letter-spacing:1px;border-radius:14px;background:#b91c1c;border-color:#ef4444}
#stop:hover{background:#dc2626}
.status{font-size:12px;color:var(--dim);line-height:1.5;min-height:18px;margin:10px 0 0}.status.warn{color:var(--warn)}
.hint{font-size:12px;line-height:1.7;color:var(--dim);margin:10px 0 0}
kbd{font:11px ui-monospace,monospace;padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;color:var(--fg)}
.joints{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-content:start}
.joints.off .joint{opacity:.55}
.joint{transition:border-color .15s,opacity .15s}.joint.moving{border-color:var(--accent);box-shadow:0 0 0 3px #60a5fa22}
.jhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.jhead h3{margin:0;font-size:17px;font-weight:650}.jhead span{font-size:12px;color:var(--dim2);font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{padding:22px 0;font-size:26px;border-radius:16px}
.btns button.on{background:var(--accent);border-color:#93c5fd;color:#06101f}
.btns small{display:block;font-size:11px;margin-top:4px;color:inherit;opacity:.8}
.row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--dim)}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row output{width:38px;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
label.flip{display:flex;align-items:center;gap:6px;cursor:pointer}
</style></head><body><div class="wrap">
<header>
  <div class="brand"><h1>Robo Arm</h1><span class="sub">L-ONE · desk arm</span></div>
  <div class="pills">
    <span class="pill"><span class="dot" id="bridge-dot"></span>Bridge <b id="bridge-txt">…</b></span>
    <span class="pill"><span class="dot" id="arm-dot"></span>Arm <b id="arm-txt">…</b></span>
  </div>
</header>
<main>
  <section class="card">
    <h2>Control</h2>
    <button id="arm">Arm to move</button>
    <button id="stop">STOP</button>
    <p class="status" id="status">Connecting…</p>
    <p class="hint">Hold a button (or key) to move a joint; let go to stop.<br>
      Base <kbd>A</kbd><kbd>D</kbd> · Shoulder <kbd>W</kbd><kbd>S</kbd> · Elbow <kbd>↑</kbd><kbd>↓</kbd><br>
      <kbd>Esc</kbd> / <kbd>Space</kbd> = STOP. Closing the page disarms.</p>
  </section>
  <section class="joints off" id="joints"></section>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});return r.json()}
async function postJSON(u,b){const r=await fetch(u,{method:'POST',body:JSON.stringify(b||{})});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||r.status);return j}

// Joint buttons: + speed is the second button. "Flip" swaps them if a joint moves the other way.
const JOINTS={base:{label:'Base',neg:['◀','left'],pos:['▶','right'],keys:{a:-1,d:1},speed:40},
  shoulder:{label:'Shoulder',neg:['▼','down'],pos:['▲','up'],keys:{s:-1,w:1},speed:30},
  elbow:{label:'Elbow',neg:['▼','down'],pos:['▲','up'],keys:{arrowdown:-1,arrowup:1},speed:30}};
const store={get(k,d){try{const v=localStorage.getItem('arm.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('arm.'+k,JSON.stringify(v))}catch(e){}}};
const keyJoint={};for(const [j,c] of Object.entries(JOINTS))for(const [k,d] of Object.entries(c.keys))keyJoint[k]=[j,d];

let armed=false,mine=false,maxSpeed=80;
const held={};          // joint -> direction (-1/1) currently held
const timers={};

function buildJoints(names){
  $('joints').innerHTML='';
  for(const j of names){const c=JOINTS[j]||{label:j,neg:['−','−'],pos:['+','+'],speed:30};
    const speed=store.get(j+'.speed',c.speed),flip=store.get(j+'.flip',false);
    const el=document.createElement('div');el.className='card joint';el.id='j-'+j;
    el.innerHTML=`<div class="jhead"><h3>${c.label}</h3><span id="r-${j}">stopped</span></div>
      <div class="btns"><button data-j="${j}" data-d="-1">${c.neg[0]}<small>${c.neg[1]}</small></button>
      <button data-j="${j}" data-d="1">${c.pos[0]}<small>${c.pos[1]}</small></button></div>
      <div class="row">Speed <input type="range" min="10" max="${maxSpeed}" step="5" value="${speed}" id="s-${j}"><output id="o-${j}">${speed}%</output></div>
      <div class="row"><label class="flip"><input type="checkbox" id="f-${j}" ${flip?'checked':''}>Flip direction</label></div>`;
    $('joints').appendChild(el);
    $('s-'+j).oninput=e=>{$('o-'+j).textContent=e.target.value+'%';store.set(j+'.speed',+e.target.value)};
    $('f-'+j).onchange=e=>store.set(j+'.flip',e.target.checked);
    for(const b of el.querySelectorAll('button[data-d]')){
      b.onpointerdown=e=>{try{b.setPointerCapture(e.pointerId)}catch(err){}press(j,+b.dataset.d)};
      b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>release(j)}}}

function speedFor(j,d){return d*(+$('s-'+j).value)*($('f-'+j).checked?-1:1)}
function press(j,d){
  if(!armed){setStatus('Arm first to move.',true);return}
  if(held[j]===d)return;held[j]=d;showHeld(j);clearInterval(timers[j]);
  const send=()=>postJSON('/hold',{joint:j,speed:speedFor(j,d)}).catch(e=>{setStatus(e.message,true);release(j)});
  send();timers[j]=setInterval(send,150)}
function release(j){
  if(held[j]===undefined)return;delete held[j];clearInterval(timers[j]);showHeld(j);
  postJSON('/release',{joint:j}).catch(()=>{})}
function releaseAll(){for(const j of Object.keys(held))release(j)}
function showHeld(j){const el=$('j-'+j);if(!el)return;
  for(const b of el.querySelectorAll('button[data-d]'))b.classList.toggle('on',held[j]===+b.dataset.d)}
function setStatus(t,warn){$('status').textContent=t;$('status').className='status'+(warn?' warn':'')}

let built=false;
function show(s){
  if(!built&&s.joints){maxSpeed=s.max_speed||80;buildJoints(s.joints);built=true}
  armed=!!s.armed;if(!armed){mine=false;releaseAll()}
  $('arm').textContent=armed?'Armed · tap to disarm':'Arm to move';$('arm').className=armed?'armed':'';
  $('joints').classList.toggle('off',!armed);
  const L=s.link||{};
  $('bridge-dot').className='dot '+(L.bridge?'ok':'bad');$('bridge-txt').textContent=L.bridge?'USB':'not found';
  $('arm-dot').className='dot '+(L.arm?'ok':'bad');$('arm-txt').textContent=L.arm?`${L.name||'arm'} ${L.version||''}`:'offline';
  for(const j of s.joints||[]){const v=(s.running||{})[j]||0;
    if($('r-'+j))$('r-'+j).textContent=v?`moving ${v>0?'+':''}${v}%`:'stopped';
    $('j-'+j)?.classList.toggle('moving',!!v)}
  if(s.error)setStatus(s.error,true);
  else setStatus((armed?'Armed — the arm can move. ':L.arm?'Disarmed. ':'Waiting for the arm… ')+`Last: ${s.last}`)}

async function lease(){
  try{show(armed&&mine?await postJSON('/arm',{armed:true,renew:true}):await getJSON('/status'))}
  catch(e){setStatus('Server offline: start web/arm_server.py on the Mac.',true);$('bridge-dot').className=$('arm-dot').className='dot bad'}
  setTimeout(lease,1000)}
lease();
$('arm').onclick=async()=>{try{mine=!armed;show(await postJSON('/arm',{armed:!armed}))}catch(e){mine=false;setStatus(e.message,true)}};
async function estop(){releaseAll();armed=false;mine=false;try{show(await postJSON('/stop',{from:'page STOP'}))}catch(e){}}
$('stop').onclick=estop;
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='escape'||k===' '){e.preventDefault();estop();return}
  const m=keyJoint[k];if(!m||e.repeat||e.metaKey||e.ctrlKey)return;e.preventDefault();press(m[0],m[1])});
addEventListener('keyup',e=>{const m=keyJoint[e.key.toLowerCase()];if(m&&held[m[0]]===m[1])release(m[0])});
addEventListener('blur',releaseAll);
addEventListener('pagehide',()=>{if(armed&&mine)navigator.sendBeacon('/stop','{"from":"page closed"}')});
</script></body></html>
