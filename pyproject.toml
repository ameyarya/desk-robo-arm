[project]
name = "cyberbrick-bridge"
version = "0.1.0"
description = "Control CyberBrick robots from a Mac through one USB-connected core board"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.scripts]
cbb = "cyberbrick_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cyberbrick_bridge"]
